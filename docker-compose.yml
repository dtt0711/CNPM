services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tourismhcm-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_Password123}"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: tourismhcm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/TourismHcm.Api/Dockerfile
    container_name: tourismhcm-api
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=TourismHcm;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Password123};TrustServerCertificate=True;Encrypt=False;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: TourismHcm
      Jwt__Audience: TourismHcm.Client
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-DevOnly_ChangeMe_UseAtLeast32Chars_LongKey!}"
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"
      Admin__Email: "${ADMIN_EMAIL:-admin@tourismhcm.local}"
      Admin__Password: "${ADMIN_PASSWORD:-Admin123!ChangeMe}"
      Translation__Provider: "${TRANSLATION_PROVIDER:-Fake}"
      Translation__ApiKey: "${GOOGLE_TRANSLATION_API_KEY:-}"
      Speech__Provider: "${SPEECH_PROVIDER:-Fake}"
      Speech__AzureKey: "${AZURE_SPEECH_KEY:-}"
      Speech__AzureRegion: "${AZURE_SPEECH_REGION:-}"
      AudioStorage__RootPath: /app/audio-storage
      AudioStorage__PublicBaseUrl: /audio
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:8081"
    ports:
      - "8080:8080"
    volumes:
      - audio_data:/app/audio-storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  migrate:
    build:
      context: .
      dockerfile: src/TourismHcm.Api/Dockerfile
      target: build
    container_name: tourismhcm-migrate
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=TourismHcm;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Password123};TrustServerCertificate=True;Encrypt=False;"
    entrypoint:
      - /bin/sh
      - -c
      - |
        dotnet tool restore || true
        dotnet ef database update --project src/TourismHcm.Infrastructure --startup-project src/TourismHcm.Api --no-build || \
        dotnet ef database update --project src/TourismHcm.Infrastructure --startup-project src/TourismHcm.Api
    profiles:
      - tools

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_MAP_TILE_URL: "${VITE_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}"
    container_name: tourismhcm-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  sql_data:
  audio_data:

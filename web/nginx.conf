resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Variable + full request_uri so Docker DNS can resolve `api` at request time
  # without breaking path rewriting (plain `proxy_pass $host/api/` drops the path).
  set $api_upstream http://api:8080;

  location /api/ {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /audio/ {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location /static/ {
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /health {
    proxy_pass $api_upstream/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
